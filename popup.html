<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 350px;
      padding: 20px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      background-color: #f8f9fa;
    }
    
    .header {
      text-align: center;
      margin-bottom: 20px;
    }
    
    h1 {
      color: #2c3e50;
      font-size: 20px;
      margin: 0 0 10px 0;
    }
    
    .url-display {
      background: #fff;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #dee2e6;
      margin-bottom: 15px;
      font-size: 12px;
      color: #6c757d;
      word-break: break-all;
      max-height: 60px;
      overflow-y: auto;
    }
    
    .controls {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }
    
    button {
      flex: 1;
      padding: 8px 12px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      transition: background-color 0.2s;
    }
    
    .analyze-btn {
      background-color: #007bff;
      color: white;
    }
    
    .analyze-btn:hover {
      background-color: #0056b3;
    }
    
    .clear-btn {
      background-color: #6c757d;
      color: white;
    }
    
    .clear-btn:hover {
      background-color: #545b62;
    }
    
    .loading {
      text-align: center;
      color: #007bff;
      font-style: italic;
      padding: 20px;
    }
    
    .results {
      background: white;
      border-radius: 6px;
      border: 1px solid #dee2e6;
      max-height: 400px;
      overflow-y: auto;
    }
    
    .stats-header {
      background: #e9ecef;
      padding: 10px;
      font-weight: bold;
      color: #495057;
      border-bottom: 1px solid #dee2e6;
      display: flex;
      justify-content: space-between;
    }
    
    .tag-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 15px;
      border-bottom: 1px solid #f1f3f4;
    }
    
    .tag-item:last-child {
      border-bottom: none;
    }
    
    .tag-name {
      font-family: 'Courier New', monospace;
      font-weight: bold;
      color: #e74c3c;
    }
    
    .tag-count {
      background: #007bff;
      color: white;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 12px;
      min-width: 20px;
      text-align: center;
    }
    
    .no-results {
      text-align: center;
      padding: 40px 20px;
      color: #6c757d;
      font-style: italic;
    }
    
    .total-count {
      font-size: 14px;
      color: #28a745;
    }
    
    .error {
      background: #f8d7da;
      color: #721c24;
      padding: 10px;
      border-radius: 4px;
      margin: 10px 0;
      border: 1px solid #f5c6cb;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🏷️ HTML Tag Counter</h1>
  </div>
  
  <div class="url-display" id="currentUrl">
    Loading current page...
  </div>
  
  <div class="controls">
    <button class="analyze-btn" id="analyzeBtn">Analyze Page</button>
    <button class="clear-btn" id="clearBtn">Clear Results</button>
  </div>
  
  <div id="loading" class="loading" style="display: none;">
    Analyzing page tags...
  </div>
  
  <div id="error" class="error" style="display: none;">
  </div>
  
  <div id="results" class="results" style="display: none;">
    <div class="stats-header">
      <span>HTML Tags</span>
      <span class="total-count" id="totalCount">Total: 0</span>
    </div>
    <div id="tagsList">
    </div>
  </div>
  
  <div id="noResults" class="no-results" style="display: none;">
    Click "Analyze Page" to count HTML tags on the current webpage.
  </div>

  <script src="popup.js"></script>
</body>
</html>
