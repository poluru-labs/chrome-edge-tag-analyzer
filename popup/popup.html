<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HTML Tag Counter</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="mast">
    <div class="mast-mark" aria-hidden="true">TC</div>
    <div class="mast-copy">
      <p class="mast-name">HTML Tag Counter</p>
      <p class="mast-tag">Count tags on the active tab</p>
    </div>
    <span class="mast-ver">1.0</span>
  </header>

  <main class="panel">
    <p class="field-label">Current page</p>
    <p id="currentUrl" class="page-url" title="">Open a tab, then click Analyze Page.</p>

    <div class="actions">
      <button type="button" id="analyzeBtn" class="btn btn-primary">Analyze Page</button>
      <button type="button" id="clearBtn" class="btn btn-ghost">Clear</button>
    </div>

    <section class="result" aria-label="Tag counts">
      <div class="result-head">
        <p class="result-kicker" id="resultKicker">Tags</p>
        <p class="result-meta" id="resultMeta"></p>
      </div>
      <div id="output" class="result-body is-empty" role="status" aria-live="polite">
        <p class="empty-title">Nothing analyzed</p>
        <p class="empty-copy">Click Analyze Page to count every HTML tag on this tab.</p>
      </div>
    </section>
  </main>

  <footer class="foot">
    Poluru Labs · Counts stay on this machine
  </footer>

  <script src="popup.js"></script>
</body>
</html>
